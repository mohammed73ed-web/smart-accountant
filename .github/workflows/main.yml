name: ONYX ERP CI and installers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-web:
    name: Accounting tests and web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: onyx-web-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows EXE installer
    runs-on: windows-latest
    needs: tests-and-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: onyx-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: tests-and-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: onyx-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
