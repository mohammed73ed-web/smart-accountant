<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14213d">
  <title>ONEX ERP</title>
</head>
<body>
  <div id="app">

    <div class="shell">
      <nav id="nav" aria-label="القائمة الرئيسية">
        <button data-page="dashboard" class="active">لوحة التحكم</button>
        <button data-page="accounts">دليل الحسابات</button>
        <button data-page="journal">قيود اليومية</button>

        <button data-page="backup">النسخ ونقل البيانات</button>
      </nav>
      <main id="content"><h1>ONEX ERP</h1></main>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
